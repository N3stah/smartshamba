# Render Blueprint — MavunoWise V3 services
# Docs: https://render.com/docs/blueprint-spec
# After committing this file, go to:
#   https://dashboard.render.com/blueprints → New Blueprint → connect your GitHub repo
# Render will read this file and create all services automatically.

services:
  - type: web
    name: mavuno-pricing-model
    runtime: docker
    # Build context = repo root (so Dockerfile can COPY research/colab/exports/)
    dockerContext: .
    dockerfilePath: ./services/pricing-model/Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000

  # ---------------------------------------------------------------------
  # Background Worker: anchors settled-batch provenance hashes on-chain
  # (Polygon Amoy, chainId 80002). Entry: lib/blockchain/worker.ts
  # Dormant until env vars are set in the Render dashboard.
  # ---------------------------------------------------------------------
  - type: worker
    name: mavuno-provenance-worker
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci --include=dev
    startCommand: npx tsx lib/blockchain/worker.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: PROVENANCE_SIGNER_PRIVATE_KEY
        sync: false
      - key: PROVENANCE_CONTRACT_ADDRESS
        sync: false
      - key: EXPECTED_CHAIN_ID
        value: "80002"
      - key: NODE_ENV
        value: production
